# Builds the site on any branch other than main and uploads the static
# output as a downloadable artifact, so changes can be checked before merging.
name: Preview build

on:
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Configure Next.js for static export
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
      - run: npm ci
      - run: npx --no-install next build
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: ./out
          retention-days: 7
      # Also publish the built files to a throwaway branch so they can be
      # fetched with plain git for review.
      - name: Push build to preview-build branch
        run: |
          cd out
          touch .nojekyll
          git init -q -b preview-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" preview-build
